name: TDR Tag and pre deploy
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
      environment:
        type: choice
        description: 'Environment'
        required: true
        options:
          - intg
          - staging
          - prod
          - dev
          - drdev
        default: 'drdev'
  push:
    branches:
      - main
permissions: {}
jobs:
  pre-deploy:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@714115ab533f9f6b0b4fed5a4293e9d57c2b89d8 # v0.0.53
    with:
      lambda-name: aggregate-processing
      repo-name: tdr-aggregate-processing
      artifact-name: aggregate-processing
      snapshot: ${{ inputs.snapshot == true }}
      java-version: ${{vars.JAVA_RUNTIME}}
      account-regional-code-bucket: true
      environment: ${{ inputs.environment }}
      build-command: |
        sbt assembly
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          gh workflow run deploy.yml --ref "$WORKFLOW_REF" \
            -f environment=drdev \
            -f to-deploy="$NEXT_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
          SNAPSHOT: ${{ inputs.snapshot == true }}
          WORKFLOW_REF: ${{ github.ref_name }}
