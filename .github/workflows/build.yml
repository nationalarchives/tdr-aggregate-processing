name: TDR Tag and pre deploy
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
permissions: {}
jobs:
  pre-deploy:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@fc52a93f9636579d7478f01a8a960007134ad30f # v0.0.51
    with:
      lambda-name: aggregate-processing
      repo-name: tdr-aggregate-processing
      artifact-name: aggregate-processing
      snapshot: ${{ inputs.snapshot == true }}
      java-version: 17
      build-command: |
        sbt assembly
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if [ "$SNAPSHOT" = "true" ]; then
            gh workflow run deploy.yml -f environment=dev -f to-deploy="$NEXT_VERSION"
          else
            gh workflow run deploy.yml -f environment=intg -f to-deploy="$NEXT_VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
          SNAPSHOT: ${{ inputs.snapshot == true }}
