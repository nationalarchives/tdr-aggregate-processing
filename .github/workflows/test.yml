name: TDR Run Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@b98899c2acfaf872e0053671743a5b1284b0dab0 # v.0.0.43
    with:
      repo-name: tdr-aggregate-processing
      test-command: |
        sbt "scalafmtCheckAll; test"
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
